name: CI/CD

on:
  pull_request:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  docker:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment: nest-bl
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Check Hub credential shape
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          u="${DOCKERHUB_USERNAME//[$'\r\n']/}"
          t="${DOCKERHUB_TOKEN//[$'\r\n']/}"
          echo "username_chars=${#u} email=$([[ $u == *@* ]] && echo yes || echo no)"
          echo "token_chars=${#t} pat_prefix=$([[ $t == dckr_pat_* ]] && echo yes || echo no)"
          if [[ $u == *@* ]]; then
            echo '::error::DOCKERHUB_USERNAME must be the Hub ID, not an email. See https://hub.docker.com/settings/general'
            exit 1
          fi
          if [[ $t != dckr_pat_* ]]; then
            echo '::error::DOCKERHUB_TOKEN must be a Hub access token (dckr_pat_...), not the account password. Create one at https://app.docker.com/settings/personal-access-tokens'
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nestjs-boilerplate
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
